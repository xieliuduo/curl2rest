<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>curl2rest</title>
    <link rel="stylesheet" href="./tab.css" />
  </head>
  <body>
    <div class="layout">
      <section class="left">
        <div class="toolbar">
          <select id="env-select" title="环境"></select>
          <button id="btn-to-curl">转为 curl</button>
          <button id="btn-to-http">转为 HTTP 格式</button>
          <button id="btn-send" class="primary">发送 ▶</button>
        </div>
        <div id="editor" class="editor"></div>
        <div class="history">
          <div class="history-title">历史记录</div>
          <ul id="history-list"></ul>
        </div>
      </section>
      <div id="gutter" class="gutter" title="拖拽调整宽度"></div>
      <section class="right">
        <div id="status-bar" class="status-bar"></div>
        <div class="tabs">
          <button class="tab active" data-tab="body">Body</button>
          <button class="tab" data-tab="headers">Headers</button>
        </div>
        <div class="panel-wrap">
          <div id="body-toolbar" class="panel-toolbar hidden">
            <button id="btn-copy-body">复制响应体</button>
          </div>
          <div id="panel-body" class="panel"></div>
          <div id="headers-toolbar" class="panel-toolbar hidden">
            <button id="btn-copy-headers">复制响应头</button>
          </div>
          <pre id="panel-headers" class="panel hidden"></pre>
        </div>
        <div id="error-card" class="error-card hidden"></div>
      </section>
    </div>
    <script type="module" src="./tab.js"></script>
  </body>
</html>
